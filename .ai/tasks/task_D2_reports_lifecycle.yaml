# Task D2: TST-001 + TST-003 — Real pipeline lifecycle test
# Root finding TST-001: create_report and NetworkClient.call are BOTH mocked
# in the only end-to-end test (test_services.py:43-52), so the CSV-writing
# pipeline never executes. Zero .csv.gz files are produced while the test passes.
# Root finding TST-003: NetworkClient.call's success/4xx/401/semaphore paths
# are never asserted — only retry-exhaustion (ConnectTimeout → RuntimeError)
# is tested in test_network.py.
#
# Fix: Create a new test file that exercises the REAL create_report pipeline
# (no create_report mock) against a doubled MediaVortexTask. NetworkClient
# is also real (sleep_time=0, max_attempts=1) — only MediaVortexTask is doubled.

id: task_D2_reports_lifecycle

title: Create test_reports_lifecycle.py — real create_report writes CSV, queue task_done

priority: high

depends_on:
  - task_D0_tv_yaml_fixture

source_reference: ".ai\plans\02-test-coverage-fixes.md"
source_section: "Block D — D2 (TST-001/003): test_reports_lifecycle.py"

description: >
  Create `tests/test_reports_lifecycle.py` with a test that exercises the real
  `TVMediaReport.create_report` pipeline end-to-end against a doubled
  `MediaVortexTask`. Unlike the old `test_run_report_with_real_models`, neither
  `create_report` nor `NetworkClient.call` is mocked — the real retry/backoff/
  semaphore logic in `NetworkClient.call` runs, and only the external Mediascope
  API client (`MediaVortexTask`) is doubled. The test asserts that CSV files are
  actually written to the export path and that the asyncio task queue's
  `task_done` accounting completes (no hang).

goals:
  - Exercise real `create_report` → `get_period` → `processing_tasks` → `worker()`
    → `send_task` → `wait_task` → `extract_data` → `prepare_data` → `csv_to_file`
    → `task_done`
  - Assert at least one `.csv.gz` file is written to the export path
  - Assert `task_queue.join()` completes (queue empty, task_done called for each item)
  - No real API calls — `MediaVortexTask` is fully doubled
  - No real filesystem pollution — all paths under `tmp_path`

# ── Exact scope (semantically anchored) ──
files:
  - path: tests/test_reports_lifecycle.py
    targets:
      - type: module
        name: test_reports_lifecycle
    changes:
      - action: add_file
        description: >
          Create the file with the test, supporting fixtures, and doubled
          MediaVortexTask setup.

# ── Architectural constraints ──
constraints:
  - "NetworkClient.call is NOT mocked — it runs for real. Only MediaVortexTask
    methods are doubled (MagicMock with configured return_value)."
  - `NetworkClient` is constructed with `sleep_time=0, max_attempts=1` (or 3)
    to minimize delays; `asyncio.sleep` is patched to a no-op for the test
    duration to avoid the 2s poll delay in `wait_task` (reports.py:278) and
    the jitter in `NetworkClient.call` (network.py:69).
  - The doubled `MediaVortexTask` (a `MagicMock` or `Spec`) must configure these
    methods with proper return values:
    - `cats.get_availability_period` → DataFrame with `id=="1"`,
      `periodFrom`, `periodTo` columns (matches `dummy_df` fixture, matches
      `base_id = options.get("kitId", 1)`)
    - `build_task` → dict (task JSON, must be truthy and not `False`)
    - `send_task` → non-empty string (task key, must be truthy)
    - `get_status` → `{"taskStatus": "DONE"}` (dict, must be truthy)
    - `get_result` → dict (result JSON, must be truthy and not `False`)
    - `result2table` → DataFrame whose columns are a superset of
      `output_columns` (see hints below), non-empty
  - Template defaults must be copied from the package settings dir to a tmp
    dir so `get_default_data_settings` can resolve `defaults/tv/crosstab.yaml`.
    Use `shutil.copytree(APP_PATHS.app_settings_dir / "defaults", tmp_defaults)`.
  - `report_service` (doubled MediaVortexTask) is passed directly to
    `TVMediaReport.__init__`; `network_client` is a real `NetworkClient`
    instance passed in the constructor.
  - `check_done=False` — prevents `Report.__init__` from scanning the export
    path for existing files (which would be empty anyway in tmp_path, but
    `check_done=False` is cleaner and avoids unnecessary I/O).
  - The `tv_yaml_content` fixture (updated in D0) is used — it has
    `last_time: {"time_unit": "w", "unit_count": 1}` and `date_filter: [...]
    ["2025-01-01", "2025-01-07"]`, so `get_period` produces one interval
    `("2025-01-01", "2025-01-07")` and `slice_period` with frequency "w"
    yields exactly one slice.

# ── Required tests / acceptance criteria ──
required_tests:
  - name: test_create_report_writes_csv_and_marks_queue_done
    type: test_function
    description: >
      Constructs a `TVMediaReport` with a doubled `MediaVortexTask` and a real
      `NetworkClient(sleep_time=0, max_attempts=1)`, calls `create_report()`,
      then asserts CSV files exist in the export path and the task queue's
      `task_done` was called for every item (queue.join completes without hang).

verification_steps:
  - command: "uv run ruff check tests/test_reports_lifecycle.py"
    expected: "All checks passed!"
  - command: "uv run pytest tests/test_reports_lifecycle.py -v"
    expected: "1 passed"
  - command: "uv run pytest tests/test_reports_lifecycle.py::test_create_report_writes_csv_and_marks_queue_done -v"
    expected: "1 passed in <2s"

acceptance_criteria:
  - New file `tests/test_reports_lifecycle.py` created
  - `test_create_report_writes_csv_and_marks_queue_done` exercises real `create_report`
    (no `mocker.patch` on `create_report` or `NetworkClient.call`)
  - After `create_report()` returns, `list(export_path.glob('*.csv.gz'))` is non-empty
  - The test completes without hanging (queue.join completes → task_done called)
  - `MediaVortexTask` is doubled (not a real API client) — no network/credential dependency
  - All filesystem writes are under `tmp_path` (pytest tmp_path fixture)
  - `asyncio.sleep` is mocked (no real delays in the test)

# ── Implementation hints ──
hints:
  doubled_media_vortex_task: >
    Build the doubled MediaVortexTask as a `MagicMock()`. Key methods return:
    - `cats.get_availability_period.return_value = dummy_df` (the conftest fixture)
    - `build_task.return_value = {"some": "task_json"}` (dict, truthy)
    - `send_task.return_value = "mock_task_key_123"` (non-empty string)
    - `get_status.return_value = {"taskStatus": "DONE"}` (dict, truthy)
    - `get_result.return_value = {"result": "data"}` (dict, truthy)
    - `result2table.return_value = <DataFrame with matching columns>`
  result2table_columns: >
    The `result2table` mock must return a non-empty DataFrame whose columns
    include every entry in `output_columns` (computed by
    `TVMediaReport.set_output_columns`, reports.py:207-221):
    - `slices` (from `data_settings.slices`, after `en_to_ru` since
      `data_lang="ru"`) with `"targetAudience"` prepended (targets non-empty)
    - `statistics` (from `data_settings.statistics`)
    For `DYNAMICS_BY_SPOTS`, these are ~25 slice columns + 5 statistics columns.
    The test should compute these columns dynamically by loading defaults,
    merging via `AppService.merge_data_settings`, and applying the same
    `en_to_ru` + `set_output_columns` logic, OR construct a DataFrame with
    a superset of columns and let `DefaultDataStrategy.prepare` select the
    needed subset.
  data_settings_construction: >
    Load `ReportSettings` from the `tv_yaml_content` fixture (parse JSON, validate
    with `ReportSettings(**rep)`). Load defaults via
    `AppService.get_default_data_settings` (needs defaults_dir populated), merge
    via `AppService.merge_data_settings` (static method), construct
    `Data(**data_dict)`.
  report_factory: >
    Use `ReportFactory(report_settings)` to get the correct
    `task_strategy` and `data_strategy` instances, same as `AppService.run_report`
    does (services.py:162-173).
