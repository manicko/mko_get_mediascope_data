---
# Task: CFG-009 — Resolve Unused pydantic-settings Dependency
# Finding: pydantic-settings>=2.12.0 declared in pyproject.toml:21 but never
# imported in src/. NetworkClient.__init__ (network.py:49-53) hardcodes
# max_concurrent_requests=5, sleep_time=2, max_attempts=10. No os.getenv()
# calls exist in core/.
#
# Dependency: None (independent)
#
# BLOCKED: Requires Researcher decision on Path A (BaseSettings), B (remove dep),
# or C (credential path only) before Implementor can proceed.

id: task_CFG009_pydantic_settings

title: Resolve unused pydantic-settings dependency

priority: low

depends_on: []

source_reference: ".ai/plans/03-config-secrets-fixes.md"
source_section: "Block 8 — CFG-009: pydantic-settings Utilization (LOW)"
source_file: ".ai/audit/99-validation/02-config-secrets-validated-findings.md"

description: >
  pydantic-settings>=2.12.0 is declared as a runtime dependency in
  pyproject.toml:21 but never imported in src/. BaseSettings is not used
  anywhere. NetworkClient.__init__ (network.py:49-53) hardcodes operational
  parameters. No env-var overrides exist anywhere in core/.

goals:
  - Resolve the dependency's purpose: either utilize it (enable env overrides)
    or remove it (if it serves no purpose)
  - Do not break existing NetworkClient behavior (defaults preserved)
  - No unused dependency in production

files:
  # ── Path A (implement BaseSettings) ──
  - path: src/mko_get_mediascope_data/core/network.py
    targets:
      - type: class
        name: NetworkClient
    changes:
      - action: add_settings
        description: >
          Add a NetworkSettings(BaseSettings) model with fields mapped to
          environment variables (MEDIOSCOPE_MAX_CONCURRENT_REQUESTS,
          MEDIOSCOPE_SLEEP_TIME, MEDIOSCOPE_MAX_ATTEMPTS). Inject into
          NetworkClient.__init__ to read from env with defaults preserved.
        code_hint: |
          from pydantic_settings import BaseSettings, SettingsConfigDict

          class NetworkSettings(BaseSettings):
              model_config = SettingsConfigDict(env_prefix="medioscope_")
              max_concurrent_requests: int = 5
              sleep_time: int = 2
              max_attempts: int = 10

          # In NetworkClient.__init__:
          settings = NetworkSettings()
          self._semaphore = asyncio.Semaphore(settings.max_concurrent_requests)
          self._sleep_time = settings.sleep_time
          self._max_attempts = settings.max_attempts
        condition: "Path A chosen by Researcher"

  - path: src/mko_get_mediascope_data/core/models.py
    targets:
      - type: module
    changes:
      - action: add_class
        description: >
          Move NetworkSettings to core/models.py for consistency with other
          Pydantic models, or create as a new section in network.py.
        condition: "Path A chosen by Researcher"
        notes: "Decision point: co-locate with NetworkClient or with other models"

  # ── Path B (remove dependency) ──
  - path: pyproject.toml
    targets:
      - type: table
        name: project.dependencies
    changes:
      - action: remove_value
        description: "Remove pydantic-settings>=2.12.0 from dependencies"
        condition: "Path B chosen by Researcher"

  # ── Test (Path A) ──
  - path: tests/test_network.py
    targets:
      - type: test_function
        name: test_network_client_reads_env_overrides
    changes:
      - action: add_function
        description: >
          With MEDIOSCOPE_MAX_ATTEMPTS=3 env var set, assert
          NetworkClient()._max_attempts == 3. Without env var, assert
          _max_attempts == 10 (default).
        condition: "Path A chosen by Researcher"

  # ── Test (Path B) ──
  - path: tests/test_network.py
    targets:
      - type: test_function
        name: test_network_client_defaults_preserved
    changes:
      - action: add_function
        description: >
          Assert NetworkClient() with no env vars uses defaults (5, 2, 10).
        condition: "Path B chosen by Researcher"

constraints:
  - "BLOCKED until Researcher selects Path A (BaseSettings), B (remove dep), or C (credential path only)"
  - "Path A: env var naming convention MEDIOSCOPE_* — must be confirmed by Researcher"
  - "Path B: verify no downstream consumer relies on pydantic_settings transitively (pydantic itself may pull it in, but explicit removal from this project's deps is safe)"
  - "NetworkClient callers (services.py:156) construct NetworkClient() with no kwargs — defaults must be preserved"
  - "All existing test_network.py tests must pass unchanged"
  - "Path A: NetworkSettings should be a module-level class in network.py, not imported in __init__"

verification_steps:
  # Path A:
  - command: "MEDIOSCOPE_MAX_ATTEMPTS=3 uv run pytest tests/test_network.py::test_network_client_reads_env_overrides -v"
    expected: "1 passed"
    condition: "Path A chosen"
  # Path B:
  - command: "uv run pytest tests/test_network.py -v"
    expected: "All tests pass (defaults preserved)"
    condition: "Path B chosen"
  - command: "uv run ruff check src/mko_get_mediascope_data/core/network.py"
    expected: "All checks passed!"

acceptance_criteria:
  - Path A: NetworkClient params are env-overridable via BaseSettings; defaults preserved (5, 2, 10)
  - Path B: pydantic-settings removed from deps; all NetworkClient tests pass
  - No behavioral regression in existing NetworkClient tests
  - ruff check passes on modified files
