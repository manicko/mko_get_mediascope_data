---
# Task: CFG-004 — Credential Existence Guard in get_connection
# Finding: AppService.get_connection (services.py:127-135) passes the credential
# path directly to MediaVortexTask without checking existence or placeholder values.
#
# Dependency: task_CFG003_credential_filename — must resolve the correct credential
# filename before adding the existence check.

id: task_CFG004_credential_guard

title: Add credential existence guard in AppService.get_connection

priority: medium

depends_on:
  - task_CFG003_credential_filename

source_reference: ".ai/plans/03-config-secrets-fixes.md"
source_section: "Block 4 — CFG-004: Credential Existence Guard (MEDIUM)"
source_file: ".ai/audit/99-validation/02-config-secrets-validated-findings.md"

description: >
  AppService.get_connection (services.py:127-135) passes
  self.app_paths.connection_config directly to MediaVortexTask without checking
  file existence. Placeholder values ('you username', '00000000-...') pass
  through undetected. NetworkClient.call (network.py:88) catches FileNotFoundError
  at the library level — not actionable from project code.

goals:
  - Fail fast with a clear, actionable error when credentials are missing
  - Error message guides the user to run 'mko-get-mediascope init'
  - No change to the happy path (file exists → proceeds as before)

files:
  - path: src/mko_get_mediascope_data/core/services.py
    targets:
      - type: method
        name: get_connection
    changes:
      - action: add_guard
        description: >
          Add Path.exists() check on self.app_paths.connection_config before
          passing to MediaVortexTask. Raise FileNotFoundError with an
          actionable message if the file is missing.
        code_hint: |
          cred_path = self.app_paths.connection_config
          if not cred_path.exists():
              raise FileNotFoundError(
                  f"Mediascope credentials not found at '{cred_path}'. "
                  f"Run 'mko-get-mediascope init' to create the settings directory."
              )

  - path: tests/test_services.py
    targets:
      - type: test_function
        name: test_get_connection_raises_on_missing_credential
    changes:
      - action: add_function
        description: >
          Assert that get_connection raises FileNotFoundError when the
          credential file does not exist, and that the error message is
          actionable (mentions 'init').

constraints:
  - "Uses Path.exists() on self.app_paths.connection_config (semantic anchor: AppService.get_connection)"
  - "Raises FileNotFoundError (not a custom error) — consistent with yaml_to_dict behavior"
  - "Error message must guide the user to run 'mko-get-mediascope init'"
  - "Do not change the MediaVortexTask instantiation arguments"
  - "If CFG-003 chose Path C (migration guard), the existence check may need to account for the _RENAME_ fallback — confirm with CFG-003 task"

verification_steps:
  - command: "uv run pytest tests/test_services.py::test_get_connection_raises_on_missing_credential -v"
    expected: "1 passed"
  - command: "uv run ruff check src/mko_get_mediascope_data/core/services.py"
    expected: "All checks passed!"
  - command: "uv run pytest tests/test_services.py -k 'connection' -v"
    expected: "All connection-related tests pass"

acceptance_criteria:
  - get_connection raises FileNotFoundError with actionable message when credential file is missing
  - get_connection still succeeds when credential file exists (happy path preserved)
  - Error message contains 'init' or equivalent guidance
  - No regression in existing test suite
