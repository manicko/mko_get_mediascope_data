# ── Transform rules (applied uniformly to all 15 files) ──
constraints:
  - "Apply to ALL entries in ALL 15 template files (not just the first entry)"
  - "Transform 1: report_type TV_CROSSTAB/TV_DICT_CROSSTAB/REG_TV_CROSSTAB/REG_TV_DICT_CROSSTAB → crosstab"
  - "Transform 2: last_time.period_type → last_time.time_unit"
  - "Transform 3: last_time.period_num → last_time.unit_count (coerce string to int for PositiveInt)"
  - "Transform 4: Add media field if missing (TV for TV files, TV_REG for REG_TV files)"
  - "Transform 5: Rename folder → relative_path (preserve value)"
  - "Transform 6: Remove category_name (absorbed by extra='allow', never consumed by core)"
  - "Do NOT touch nat_tv_brands_tefal.yaml (already passes validation)"
  - "Do NOT change any data values (slices, statistics, options, company_filter, etc.)"
  - "Reference template: settings/reports/nat_tv_brands_tefal.yaml"
  - "Template-first principle: repair templates, never change Pydantic models"

# ── Required tests / acceptance criteria ──
required_tests:
  - name: test_bundled_templates_validate
    type: new_test
    description: >
      Iterates all .yaml files in settings/reports/, loads each entry, and
      validates with ReportSettings(**entry). Asserts all 32 entries pass.
    expected: "32/32 PASS"

verification_steps:
  - command: "uv run pytest tests/test_models.py::test_bundled_templates_validate -v"
    expected: "1 passed (32/32 entries validate)"
  - command: "python -c \"import yaml, glob; from mko_get_mediascope_data.core.models import ReportSettings; ... validate all 32 entries\""
    expected: "32/32 PASS, 0 ValidationError"
  - command: "uv run ruff check src/  # no Python code changed, but verify no side-effects"
    expected: "All checks passed!"

acceptance_criteria:
  - All 15 template files modified (nat_tv_brands_tefal.yaml untouched)
  - All 32 entries pass ReportSettings(**rep) validation (was: 2 PASS, 30 FAIL)
  - No data values changed (only field/enum names and types)
  - media field present on all entries that lacked it
  - relative_path field present on all entries that used folder
  - period_num coerced from string to int where needed
  - test_bundled_templates_validate passes
