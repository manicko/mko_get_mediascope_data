# Task: CFG-001 — Repair All Report Templates
# Finding: 30 of 32 bundled report entries fail ReportSettings(**rep).
# Defects: stale report_type enum values (TV_CROSSTAB etc → crosstab),
# stale field names (period_type → time_unit, period_num → unit_count),
# missing media/relative_path, folder/category_name instead of relative_path.
#
# Reference template (PASSES): nat_tv_brands_tefal.yaml — its 2 entries are the
# only bundled entries that pass ReportSettings validation.
#
# Dependency: Must complete before CFG-007 (T06) — templates must pass validation
# before the data-settings merge chain can be exercised end-to-end.

id: task_CFG001_repair_templates

title: Repair 15 report template files to conform to ReportSettings schema

priority: high

depends_on: []

# ── Plan/Audit report source ──
source_reference: ".ai/plans/03-config-secrets-fixes.md"
source_section: "Block 3 — CFG-001: Repair All Report Templates (HIGH)"
source_file: ".ai/audit/99-validation/02-config-secrets-validated-findings.md"

description: >
  30 of 32 bundled report entries fail ReportSettings(**rep) validation.
  The reference template nat_tv_brands_tefal.yaml (entries [0] and [1] both
  PASS) defines the correct pattern. Apply the same field/enum corrections to
  all 15 affected template files so all 32 entries validate. This is a
  template-first repair: conform templates to the Pydantic models, never
  change the code.

goals:
  - All 32 bundled report entries pass ReportSettings(**rep)
  - All 15 template files repaired (nat_tv_brands_tefal.yaml untouched — already passes)
  - All data values preserved (slices, statistics, options, company_filter, ad_filter, etc.)
  - Follow settings-layers-architecture.md conformance rules (template-first)

