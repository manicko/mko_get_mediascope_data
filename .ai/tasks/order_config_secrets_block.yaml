# Execution order for config-secrets remediation blocks (CFG-001 through CFG-009, DEADCODE, VERIFY)
#
# Phase 0 (parallel, no Researcher blocker):
#   T1 (CFG-001 repair templates), T5 (CFG-006 missing defaults),
#   T7 (CFG-008 atomic copy), T9 (DEADCODE cleanup)
# These can run in any order and in parallel with no dependencies.
#
# Phase 1 (parallel, blocked on Researcher decision):
#   T3 (CFG-003 credential filename), T8 (CFG-009 pydantic-settings)
#   Researcher must select paths; then Implementor proceeds.
#   T6 (CFG-007 subtype defaults) also needs Researcher but additionally
#   depends on T1 (templates must pass validation first).
#
# Phase 2 (sequential dependencies resolve):
#   T4 (CFG-004 credential guard) depends on T3 (Researcher selects credential path).
#   T2 (CFG-001 test validation) depends on T1 (templates repaired).
#
# Phase 3 (final verification):
#   T10 (VERIFY) depends on all implementation tasks completing.

tasks:
  # ── Phase 0: No dependencies, no Researcher blocker ──
  - id: task_CFG001_repair_templates
    depends_on: []
    blocked_on: "Direct to Implementor"

  - id: task_CFG006_missing_defaults
    depends_on: []
    blocked_on: "Direct to Implementor"

  - id: task_CFG008_atomic_copy
    depends_on: []
    blocked_on: "Direct to Implementor"

  - id: task_DEADCODE_cleanup
    depends_on: []
    blocked_on: "Direct to Implementor (WrongDataSettings decision coupled to task_CFG007)"

  # ── Phase 1: Blocked on Researcher decision ──
  - id: task_CFG003_credential_filename
    depends_on: []
    blocked_on: "Researcher (select credential migration path A/B/C)"

  - id: task_CFG009_pydantic_settings
    depends_on: []
    blocked_on: "Researcher (select pydantic-settings path A/B/C)"

  # T6 depends on T1 (templates must pass ReportSettings validation)
  # AND blocked on Researcher (select subtype fix path A/B/C/D)
  - id: task_CFG007_subtype_defaults
    depends_on:
      - task_CFG001_repair_templates
    blocked_on: "Researcher (select subtype data-fix/code-guard path A/B/C/D)"

  # ── Phase 2: Sequential dependencies on prior blocks ──
  # T4 depends on T3 — credential filename must be known before writing guard
  - id: task_CFG004_credential_guard
    depends_on:
      - task_CFG003_credential_filename

  # T2 depends on T1 — template validation test requires templates repaired first
  - id: task_CFG001_test_validate_templates
    depends_on:
      - task_CFG001_repair_templates

  # ── Phase 3: Final verification ──
  - id: verify_config_secrets_regression
    depends_on:
      - task_CFG001_repair_templates
      - task_CFG001_test_validate_templates
      - task_CFG003_credential_filename
      - task_CFG004_credential_guard
      - task_CFG006_missing_defaults
      - task_CFG007_subtype_defaults
      - task_CFG008_atomic_copy
      - task_CFG009_pydantic_settings
      - task_DEADCODE_cleanup
