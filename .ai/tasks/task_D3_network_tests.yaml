---
# Task D3: TST-003 — Network client test coverage gap
# Root finding: tests/test_network.py only tests the retry-exhaustion path
# (ConnectTimeout → RuntimeError). The success-return, 4xx-immediate-raise,
# 401-AuthorizationError, and semaphore-concurrency paths in NetworkClient.call
# (network.py:59-126) are never asserted.

id: task_D3_network_client_tests

title: Add NetworkClient.call test cases — success, 4xx, 401, semaphore

priority: high

depends_on: []

source_reference: ".ai\plans\02-test-coverage-fixes.md"
source_section: "Block D — D3 (TST-003): Network client tests"

description: >
  Extend `tests/test_network.py` with test cases that exercise the distinct
  execution paths through `NetworkClient.call` (network.py:59-126). Currently
  only `test_network_retry_and_fail` exists, which verifies retry exhaustion
  on a `ConnectTimeout`. Add tests for: the success return path, `BadRequestError`
  (4xx) immediate raise, `AuthorizationError` (401) immediate raise, and
  semaphore concurrency control. All tests must use `sleep_time=0` and mock
  `asyncio.sleep` to complete quickly.

goals:
  - Cover the success return path of `NetworkClient.call` (returns `func` result)
  - Cover `BadRequestError` (4xx) immediate re-raise (no retry)
  - Cover `AuthorizationError` (401) immediate re-raise (no retry)
  - Cover semaphore concurrency limit (optional but recommended)
  - All tests complete quickly (< 1s each, using `sleep_time=0` + mocked sleep)

# ── Exact scope (semantically anchored) ──
files:
  - path: tests/test_network.py
    targets:
      - type: test_function
        name: test_call_returns_result_on_success
      - type: test_function
        name: test_call_raises_immediately_on_bad_request
      - type: test_function
        name: test_call_raises_immediately_on_auth_error
      - type: test_function
        name: test_call_respects_semaphore
    changes:
      - action: add_test_functions
        description: >
          Add four new test functions after the existing test functions
          (after the `test_mock_network_client_retries_on_retryable_error`
          function). Each targets a distinct code path in `NetworkClient.call`.

# ── Architectural constraints ──
constraints:
  - "Do NOT mock `NetworkClient.call` itself — exercise the real method.
    This is the core of TST-003: the doubling in test_services.py mocks
    NetworkClient.call entirely, so its internal paths are never tested."
  - All tests use `NetworkClient(max_attempts=3, sleep_time=0)` to minimize
    retry backoff delays.
  - `asyncio.sleep` is patched (via `mocker.patch("asyncio.sleep", new=AsyncMock())`)
    so no real time passes.
  - `BadRequestError` and `AuthorizationError` are imported from
    `mediascope_api.core.errors`.
  - HTTPError with 4xx status is available via `requests.exceptions.HTTPError`.
  - The semaphore test uses a function that records concurrent invocations
    (e.g., a counter with `asyncio.Event`) to verify that no more than
    `max_concurrent_requests` calls execute simultaneously.

# ── Required tests / acceptance criteria ──
required_tests:
  - name: test_call_returns_result_on_success
    type: test_function
    description: >
      A plain callable returning a value exercises the success path:
      `NetworkClient.call` returns the function's result via
      `asyncio.to_thread(func, *args, **kwargs)` (network.py:73-74).
    assertions:
      - Return value equals the function's output
      - No exception raised
      - `asyncio.sleep` called (for initial jitter) but returns immediately

  - name: test_call_raises_immediately_on_bad_request
    type: test_function
    description: >
      A function raising `BadRequestError` (mediascope_api.core.errors)
      is re-raised immediately without retry (network.py:76-78).
    assertions:
      - `pytest.raises(BadRequestError)`
      - The function is called exactly once (no retry)

  - name: test_call_raises_immediately_on_auth_error
    type: test_function
    description: >
      A function raising `AuthorizationError` (mediascope_api.core.errors)
      is re-raised immediately without retry (network.py:80-86).
    assertions:
      - `pytest.raises(AuthorizationError)`
      - The function is called exactly once (no retry)

  - name: test_call_respects_semaphore
    type: test_function
    description: >
      With `max_concurrent_requests=2` and 5 concurrent calls, no more than 2
      execute simultaneously. Uses an `asyncio.Event` counter to detect
      concurrency.
    assertions:
      - `max_concurrent_observed <= 2`
      - All 5 calls complete successfully

verification_steps:
  - command: "uv run ruff check tests/test_network.py"
    expected: "All checks passed!"
  - command: "uv run pytest tests/test_network.py -v"
    expected: "5 passed" (2 existing + 3 new; semaphore is optional)
  - command: "uv run pytest tests/test_network.py::test_call_returns_result_on_success tests/test_network.py::test_call_raises_immediately_on_bad_request tests/test_network.py::test_call_raises_immediately_on_auth_error -v"
    expected: "3 passed"

acceptance_criteria:
  - 3 new test functions added to `tests/test_network.py`
  - Success path verified: real `NetworkClient.call` returns the function's result
  - `BadRequestError` verified: raises immediately, called once (no retry)
  - `AuthorizationError` verified: raises immediately, called once (no retry)
  - (optional) Semaphore test verifies concurrency limit
  - All new tests use `sleep_time=0` and mocked `asyncio.sleep`
  - All tests complete in < 1 second each
  - No real network calls made (all callables are plain Python functions/lambdas)

# ── Implementation hints ──
hints:
  imports: >
    Add to tests/test_network.py:
    - `from mediascope_api.core.errors import AuthorizationError, BadRequestError`
    - `from requests.exceptions import HTTPError` (for semaphore test or 4xx test)
  success_test: >
    Use a simple function: `def success_func(): return {"result": "ok"}`.
    Call `await client.call(success_func)`. The initial `asyncio.sleep` is mocked
    but the `asyncio.to_thread(func)` still runs the real function.
  error_tests: >
    Use functions that raise the respective errors. Assert
    `pytest.raises(...)`. Verify the function was called only once
    (not retried) by checking a call counter or using a MagicMock
    with `side_effect=AuthorizationError("...")`.
  semaphore_test: >
    Create `NetworkClient(max_concurrent_requests=2, max_attempts=1, sleep_time=0)`.
    Use an `asyncio.Event` + counter to track concurrent invocations.
    Run 5 concurrent `client.call` tasks where each function increments the
    counter, sleeps briefly (mocked), and records the max concurrency.
