---
# Task: CFG-001-test — Add bundled template validation test
# Finding: No test asserts bundled template validity.
# The original finding recommends test_bundled_templates_validate — this test
# does not exist in tests/ (code_context §5.5 confirms this gap).
#
# Dependency: task_CFG001_repair_templates — test only passes after templates
# are repaired.

id: task_CFG001_test_validate_templates

title: Add test_bundled_templates_validate — assert all 32 entries pass ReportSettings

priority: high

depends_on:
  - task_CFG001_repair_templates

source_reference: ".ai/plans/03-config-secrets-fixes.md"
source_section: "Block 3 — CFG-001: Repair All Report Templates (HIGH) — verification"
source_file: ".ai/audit/99-validation/02-config-secrets-validated-findings.md"

description: >
  No test asserts bundled template validity. The only ReportSettings validation
  test is test_models.py::test_report_settings_valid (uses hand-written valid data,
  not templates). Create a test that iterates all .yaml files in
  settings/reports/, loads each entry, and validates with ReportSettings(**entry).
  This test pins down the template-validity invariant and prevents future drift.

goals:
  - All 32 entries validated against ReportSettings
  - Test fails fast on any template drift (regression guard)
  - Test is hermetic (reads from package templates via APP_PATHS.app_settings_dir, not user dir)

files:
  - path: tests/test_models.py
    targets:
      - type: test_function
        name: test_bundled_templates_validate
    changes:
      - action: add_function
        description: >
          Iterate settings/reports/**/*.yaml, parse each YAML list, validate
          each entry with ReportSettings.model_validate(entry). Assert all 32
          entries pass without ValidationError. Uses APP_PATHS.app_settings_dir
          to locate bundled templates (read-only package path).

# ── Architectural constraints ──
constraints:
  - "Read from APP_PATHS.app_settings_dir (package templates, read-only) — never the user dir"
  - "Use yaml.safe_load to parse template YAML files"
  - "Use ReportSettings.model_validate (Pydantic v2) for validation"
  - "Test runs in the default (non-slow) suite — it is a fast unit test"
  - "If any entry fails, report which file and which entry index failed"

# ── Required tests / acceptance criteria ──
required_tests:
  - name: test_bundled_templates_validate
    type: new_test
    description: >
      Iterates all 15 .yaml template files in settings/reports/, validates all
      32 entries. Expects 32/32 PASS.
    expected: "1 passed"

verification_steps:
  - command: "uv run pytest tests/test_models.py::test_bundled_templates_validate -v"
    expected: "1 passed"
  - command: "uv run pytest -m 'not slow' -v"
    expected: "All tests pass (existing + new)"
  - command: "uv run ruff check tests/test_models.py"
    expected: "All checks passed!"

acceptance_criteria:
  - Test iterates all .yaml files in settings/reports/ (15 files)
  - All 32 entries pass ReportSettings validation
  - Test is in the default (non-slow) suite
  - Test clearly reports which file/entry failed if validation fails
  - ruff check passes on the test file
