---
# Task: CFG-003 — Credential File Name Alignment
# Finding: Template mediascope_RENAME_.json is copied verbatim, but code reads
# AppPaths.connection_config → connections/mediascope.json (paths.py:58-59).
# After init, the expected file does not exist.
#
# BLOCKED: Requires Researcher decision on Path A (rename), B (code fallback),
# or C (migration guard) before Implementor can proceed.
# Dependency: Must resolve before CFG-004 (T04) — credential guard must check
# the correct filename.

id: task_CFG003_credential_filename

title: Fix credential file name mismatch (mediascope_RENAME_.json → mediascope.json)

priority: high

depends_on: []

# ── Plan/Audit report source ──
source_reference: ".ai/plans/03-config-secrets-fixes.md"
source_section: "Block 2 — CFG-003: Credential File Name Alignment (HIGH)"
source_file: ".ai/audit/99-validation/02-config-secrets-validated-findings.md"

description: >
  The template settings/connections/mediascope_RENAME_.json is copied verbatim
  by _copy_templates (init_service.py:7-27) via shutil.copy2 (line 27), but
  AppPaths.connection_config (paths.py:58-59) hardcodes the path
  connections/mediascope.json. After init_project(), the credential file lands
  at mediascope_RENAME_.json and the code looks for mediascope.json — they never
  match. The _RENAME_ suffix is a placeholder meant to remind users to rename,
  but no guard or migration path resolves it.

goals:
  - Credential file is readable by code after init_project()
  - Existing users who already renamed are not broken (backward compatible)
  - Path is verifiable by a test asserting post-init credential filename

# ── Exact scope (semantically anchored) ──
files:
  # ── Template file (always needs renaming in Path A or C) ──
  - path: src/mko_get_mediascope_data/settings/connections/mediascope_RENAME_.json
    targets:
      - type: file
    changes:
      - action: rename
        description: >
          Rename template from mediascope_RENAME_.json to mediascope.json so
          that _copy_templates copies it to the correct filename.
        condition: "Path A (rename) or Path C (rename + migration) chosen by Researcher"

  # ── Code change (only if Path B or C) ──
  - path: src/mko_get_mediascope_data/core/paths.py
    targets:
      - type: property
        name: connection_config
    changes:
      - action: add_fallback
        description: >
          If Path C chosen: add a helper that checks for both mediascope.json
          and mediascope_RENAME_.json, preferring mediascope.json. If only the
          _RENAME_ variant exists, log a deprecation warning and return it.
        condition: "Path B or C chosen by Researcher"

  # ── Test ──
  - path: tests/test_init_credentials.py
    targets:
      - type: test_function
        name: test_init_produces_readable_credential_file
    changes:
      - action: add_function
        description: >
          After init_project(force=False), assert that
          connections/mediascope.json exists in the user settings dir and
          AppPaths.connection_config resolves to an existing Path.

# ── Architectural constraints ──
constraints:
  - "BLOCKED until Researcher selects a path: A (rename), B (code fallback), C (rename + migration guard)"
  - "Path A: rename only — simplest, no code change. Risk: existing users who renamed lose the update."
  - "Path B: code fallback only — backward compatible but carries _RENAME_ cruft permanently."
  - "Path C: rename + migration guard — safest rollout; checks both filenames, warns on old variant."
  - "Path C must integrate with CFG-004 (credential existence guard in get_connection)."
  - "The credential template contains placeholders ('you username', '00000000-...') — do NOT put real credentials."
  - "Do not modify the credential JSON contents — only rename or add migration logic."

# ── Required tests / acceptance criteria ──
required_tests:
  - name: test_init_produces_readable_credential_file
    type: new_test
    description: >
      Init project into a temp dir, assert connections/mediascope.json exists,
      and AppPaths.connection_config exists.

verification_steps:
  - command: "uv run pytest tests/test_init_credentials.py::test_init_produces_readable_credential_file -v"
    expected: "1 passed"
  - command: "python -c \"from pathlib import Path; from mko_get_mediascope_data.core.init_service import init_project; ... assert (settings_dir / 'connections' / 'mediascope.json').exists()\""
    expected: "No FileNotFoundError; file exists at mediascope.json"
  - command: "uv run ruff check src/mko_get_mediascope_data/core/paths.py src/mko_get_mediascope_data/core/init_service.py"
    expected: "All checks passed!"

acceptance_criteria:
  - After init_project(), AppPaths.connection_config resolves to an existing file
  - The template is named mediascope.json (Path A/C) OR code checks both filenames (Path B)
  - test_init_produces_readable_credential_file passes
  - Placeholder credentials preserved (no real secrets in template)
  - Backward compatible with existing users (Path B/C migration)
