---
# Task: DEADCODE — Remove Dead None-Guards in AppService.app_config
# Finding (residual from CFG-005): Since yaml_to_dict (utils.py:343-367) always
# returns dict (never None), the None-guards in AppService.app_config
# (services.py:40-44, 48-52) are unreachable dead code.
#
# Also: WrongDataSettings (core/errors.py:5-6) is defined but never imported.
# The decision on whether to use it is coupled to Block 6 (CFG-007):
# if CFG-007 chooses a code-guard path, WrongDataSettings gets imported there.
# This task (9a) handles only the dead-code removal.
#
# Dependency: None (independent)

id: task_DEADCODE_cleanup

title: Remove dead None-guards in AppService.app_config + WrongDataSettings decision

priority: low

depends_on: []

source_reference: ".ai/plans/03-config-secrets-fixes.md"
source_section: "Block 9 — Dead Code Cleanup + WrongDataSettings (residual, LOW)"
source_file: ".ai/tmp/code_context_config_secrets.md"

description: >
  Since yaml_to_dict (utils.py:343-367) always returns a dict (never None) —
  it returns `yaml.safe_load(cfg) or {}` and both except blocks raise — the
  None-guards in AppService.app_config (services.py:40-44, 48-52) are unreachable
  dead code. Remove them. The yaml_to_dict function already raises
  FileNotFoundError or YAMLError with logging; the guards were a second layer
  for an impossible None return.
  Also: WrongDataSettings (core/errors.py:5-6) is defined but never imported.
  If CFG-007 (Block 6) chose a code-guard path, WrongDataSettings would be
  imported there. If CFG-007 chose the data-fix path, WrongDataSettings remains
  unused — decide whether to remove it or leave it.

goals:
  - Remove the two if ... is None: raise FileNotFoundError(...) blocks from app_config
  - No behavioral change (yaml_to_dict raises directly)
  - No test regression
  - WrongDataSettings decision resolved (used or removed)

files:
  - path: src/mko_get_mediascope_data/core/services.py
    targets:
      - type: function
        name: app_config
    semantic_anchors:
      remove:
        type: if_statement
        value: "if logging_settings_dict is None:"
      remove:
        type: if_statement
        value: "if app_settings_dict is None:"
    changes:
      - action: remove_block
        description: >
          Remove the None-guard for logging_settings_dict (services.py:40-44)
          and app_settings_dict (services.py:48-52). yaml_to_dict raises
          FileNotFoundError/YAMLError directly; the guards are dead code.

  - path: src/mko_get_mediascope_data/core/errors.py
    targets:
      - type: class
        name: WrongDataSettings
    changes:
      - action: decision
        description: >
          If CFG-007 Path B/C (code guard) was chosen and WrongDataSettings
          was imported there: no action needed here.
          If CFG-007 Path A (data fix) was chosen: remove WrongDataSettings
          (defined but unused) OR leave it with a docstring noting it is
          reserved for future use.
        condition: "Depends on Block 6 Researcher decision"

constraints:
  - "The None-guards are provably dead: yaml_to_dict returns `yaml.safe_load(cfg) or {}` (never None) and both except blocks raise"
  - "Removing the guards does NOT change behavior — yaml_to_dict raises FileNotFoundError at utils.py:365-367 with logging before the guard would be reached"
  - "WrongDataSettings removal is coupled to Block 6 (CFG-007) decision — do NOT remove if it was imported there"
  - "No existing test exercises the None-guard path (it's unreachable)"
  - "ruff will not flag class definitions in errors.py as unused"

# ── Required tests / acceptance criteria ──
required_tests:
  - name: test_app_config_is_cached
    type: existing_test
    description: "Tests AppService.app_config caching — must still pass"
  - name: test_reload_config_invalidates_cache
    type: existing_test
    description: "Tests reload_config — must still pass"
  - name: test_reload_config_before_access_does_not_raise
    type: existing_test
    description: "Tests reload_config safety — must still pass"

verification_steps:
  - command: "uv run pytest tests/test_services.py -k 'app_config or reload_config' -v"
    expected: "4 passed"
  - command: "grep -n 'is None' src/mko_get_mediascope_data/core/services.py"
    expected: "No None-guards on yaml_to_dict return values in app_config"
  - command: "uv run ruff check src/mko_get_mediascope_data/core/services.py"
    expected: "All checks passed!"

acceptance_criteria:
  - app_config no longer contains if ... is None guards for yaml_to_dict return values
  - All 4 app_config/reload_config tests pass
  - ruff check passes
  - WrongDataSettings decision is documented (used or removed, per Block 6 outcome)
