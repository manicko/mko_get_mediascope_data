name: CI

# Triggers on every push and pull request to any branch.
on:
  push:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Lint (ruff)
        run: uv run ruff check src tests ci

      - name: Test (pytest)
        run: uv run pytest

      - name: Typecheck (mypy)
        run: uv run mypy src tests ci
