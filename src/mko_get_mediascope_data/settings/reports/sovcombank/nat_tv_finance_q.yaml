- media: TV
  report_type: crosstab
  report_subtype: DYNAMICS_BY_SPOTS
  compression:
    method: gzip
  data_lang: ru
  relative_path: raw_data_cards
  multiple_files: true
  ad_filter: articleLevel4Id IN (2479, 4499, 4988) and adIssueStatusId = R
  target_audiences:
    all 18+: age >= 18
  period:
    date_filter:
    - '2022-01-01'
    - '2024-11-30'
    time_unit: m
  slices: []
  statistics:
  - CumReachPer
  - RtgPerSum
  - QuantitySum
  - Universe000Avg
