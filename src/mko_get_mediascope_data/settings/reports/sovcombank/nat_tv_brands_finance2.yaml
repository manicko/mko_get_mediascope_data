- media: TV
  report_type: crosstab
  report_subtype: DYNAMICS_BY_SPOTS
  compression:
    method: gzip
  data_lang: ru
  relative_path: raw_data
  multiple_files: true
  ad_filter: articleLevel2Id = 2272 and adIssueStatusId = R
  target_audiences:
    all 18+: age >= 18
  period:
    date_filter:
    - '2024-01-01'
    - '2024-05-31'
    time_unit: m
- media: TV
  report_type: crosstab
  report_subtype: DYNAMICS_BY_SPOTS_DICT
  data_lang: ru
  relative_path: dict
  multiple_files: true
  ad_filter: articleLevel2Id = 2272 and adIssueStatusId = R
  target_audiences:
    not_set: None
  period:
    date_filter:
    - '2024-01-01'
    - '2024-12-31'
    time_unit: m
