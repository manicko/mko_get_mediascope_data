- media: TV_REG
  report_type: crosstab
  report_subtype: DYNAMICS_BY_SPOTS
  compression:
    method: gzip
  data_lang: ru
  relative_path: raw_data
  multiple_files: true
  ad_filter: advertiserId IN (272345) AND adIssueStatusId = R
  target_audiences:
    all 4+: age >= 4
  period:
    date_filter: null
    last_time:
      unit_count: 1
      include_current: false
    time_unit: w
  options:
    kitId: 3
    issueType: AD
    standRtg:
      useRealDuration: true
      standardDuration: 20
  statistics:
  - RtgPerSum
  - StandRtgPerSum
  - QuantitySum
