- media: TV
  report_type: crosstab
  report_subtype: DYNAMICS_BY_SPOTS
  compression:
    method: gzip
  data_lang: ru
  relative_path: raw_data
  multiple_files: true
  ad_filter: articleLevel3Id IN (81)  AND adIssueStatusId = R
  target_audiences:
    all 20-45 BC: age >= 20 AND age <= 45 AND incomeGroupRussia IN (2,3)
  period:
    date_filter:
    - '2024-01-01'
    - '2026-12-31'
    time_unit: m
- media: TV
  report_type: crosstab
  report_subtype: DYNAMICS_BY_SPOTS_DICT
  data_lang: ru
  relative_path: dict
  multiple_files: true
  ad_filter: articleLevel3Id IN (81)  AND adIssueStatusId = R
  target_audiences:
    not_set: None
  period:
    date_filter:
    - '2024-01-01'
    - '2026-12-31'
    time_unit: m
